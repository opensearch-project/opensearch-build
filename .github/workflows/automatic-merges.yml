---
name: automatic-merges

on:
  workflow_run:
    # If new workflows triggered on pull request are added, they should be added to this list
    workflows:
      - Link Checker
      - yaml-lint
      - dockerfile-lint
      - groovy-tests
      - manifests
      - python-tests
    types: completed

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

jobs:
  automatic-merge-manifests:
    if: github.repository == 'opensearch-project/opensearch-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - id: find-triggering-pr
        uses: ./.github/actions/find-triggering-pr
        with:
          token: ${{ github.token }}

      - uses: ./.github/actions/discerning-merger
        if: steps.find-triggering-pr.outputs.pr-number != ''
        with:
          token: ${{ github.token }}
          pull-request-number: ${{ steps.find-triggering-pr.outputs.pr-number }}
          allowed-authors: |
            dependabot[bot]
            opensearch-trigger-bot
            opensearch-ci-bot
            peterzhuamazon
            gaiksaya
            rishabh6788
            zelinh
            prudhvigodithi
            Divyaasm
            dblock
            tianleh
            peternied
          allowed-files: |
            manifests/*/*.yml

  automatic-merge-new-manifests:
    if: github.repository == 'opensearch-project/opensearch-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - id: find-triggering-pr
        uses: ./.github/actions/find-triggering-pr
        with:
          token: ${{ github.token }}

      - uses: ./.github/actions/discerning-merger
        if: steps.find-triggering-pr.outputs.pr-number != ''
        with:
          token: ${{ github.token }}
          pull-request-number: ${{ steps.find-triggering-pr.outputs.pr-number }}
          allowed-authors: |
            opensearch-ci-bot
          allowed-files: |
            manifests/*/*.yml
            jenkins/check-for-build.jenkinsfile
